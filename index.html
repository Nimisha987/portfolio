*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:64px 20px 0}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:1px}
a:hover{text-decoration-color:currentColor}
a:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-size:20px;font-weight:600;margin:0;line-height:1.3}
h1 small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:2px}
.tagline{color:var(--muted);margin:14px 0 0;max-width:46ch}
#theme{flex:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
#theme:hover{color:var(--fg)}
.socials{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.socials a{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:14px;color:var(--muted)}
.socials a:hover{color:var(--fg);border-color:var(--muted)}
h2{font-size:15px;font-weight:400;color:var(--muted);margin:72px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 26px 22px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:500;margin:0;line-height:1.5}
.card h3 .badge{font-size:12px;color:var(--muted);margin-left:6px}
.date{font-size:13px;color:var(--muted);text-transform:uppercase;margin-top:4px}
.summary{color:var(--muted);margin:18px 0 0}
.sub{color:var(--muted);margin:2px 0 0}
.desc{color:var(--muted);margin:18px 0 0}
.points{list-style:none;margin:22px 0 0;padding:0 0 0 30px;position:relative}
.points::before{content:"";position:absolute;left:4px;top:12px;bottom:12px;width:1px;background:var(--line)}
.points li{position:relative;margin-bottom:22px}
.points li:last-child{margin-bottom:4px}
.points li::before{content:"";position:absolute;left:-30px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.points b{font-weight:500;display:block}
.points span{display:block;color:var(--muted);margin-top:2px}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 18px;font-size:14px}
.pill:hover{border-color:var(--muted)}
.pill.primary{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.pill svg{width:16px;height:16px;fill:currentColor}
.skill{display:grid;grid-template-columns:110px 1fr;gap:4px 16px;margin-bottom:16px}
.skill:last-child{margin-bottom:0}
.skill dt{color:var(--muted)}
.skill dd{margin:0}
@media (max-width:520px){.skill{grid-template-columns:1fr}}
.sig{margin-top:96px;height:220px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 110%,var(--glow),transparent 70%)}
.sig span{font-family:"Pixelify Sans","Geist Mono",monospace;font-size:clamp(72px,26vw,170px);line-height:.8;margin-bottom:-.12em;letter-spacing:-.02em;

</style>
</head>
